{% extends "base.html" %}
{% block content %}
<div class="card vn-kanban-shell">
  <div class="vn-app-header">
    <div>
      <h2>Kanban Board</h2>
      <div class="muted">Track work in this database and link cards back to notes.</div>
    </div>
    <div class="vn-app-actions">
      {% if can_edit %}<button class="btn primary" type="button" id="vnKanbanAddColumn">Add column</button>{% endif %}
      <a class="btn" href="{{ url_for('content') }}">Back to Content</a>
    </div>
  </div>
  {% if not can_edit %}<div class="help" style="margin-top:10px;">Unlock this database to edit the board.</div>{% endif %}
  <div id="vnKanbanStatus" class="vn-kanban-status" aria-live="polite"></div>
  <div id="vnKanbanBoard" class="vn-kanban-board" aria-label="Kanban board"></div>
</div>

<div id="vnKanbanCardModal" class="vn-modal-backdrop hidden">
  <div class="vn-modal vn-kanban-modal" role="dialog" aria-modal="true" aria-labelledby="vnKanbanCardModalTitle" onclick="event.stopPropagation()">
    <div class="vn-modal-header">
      <div class="vn-modal-title" id="vnKanbanCardModalTitle">Card</div>
      <button class="vn-modal-close" type="button" id="vnKanbanCardClose">x</button>
    </div>
    <form id="vnKanbanCardForm" class="vn-modal-body">
      <input type="hidden" id="vnKanbanCardId">
      <input type="hidden" id="vnKanbanCardColumnId">
      <label>Title
        <input class="input" id="vnKanbanCardTitle" maxlength="140" required>
      </label>
      <label>Details
        <textarea class="input" id="vnKanbanCardBody" rows="5" maxlength="5000" placeholder="Optional notes, next steps, links..."></textarea>
      </label>
      <label>Linked note
        <select class="input" id="vnKanbanCardNote">
          <option value="">No linked note</option>
          {% for note in notes %}
            <option value="{{ note.id }}">{{ note.title or ('Note #' ~ note.id) }}{% if note.tag %} · {{ note.tag }}{% endif %}</option>
          {% endfor %}
        </select>
      </label>
      <div class="vn-modal-footer">
        <button class="btn danger" type="button" id="vnKanbanDeleteCard">Delete</button>
        <div style="flex:1;"></div>
        <button class="btn" type="button" id="vnKanbanCardCancel">Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
window.VORTNOTES_KANBAN = {
  columns: {{ columns|tojson }},
  cards: {{ cards|tojson }},
  notes: {{ notes|tojson }},
  canEdit: {{ 'true' if can_edit else 'false' }},
  urls: {
    columnSave: {{ url_for('kanban_column_save')|tojson }},
    columnDelete: {{ url_for('kanban_column_delete')|tojson }},
    cardSave: {{ url_for('kanban_card_save')|tojson }},
    cardMove: {{ url_for('kanban_card_move')|tojson }},
    cardDelete: {{ url_for('kanban_card_delete')|tojson }}
  },
  noteUrlBase: {{ url_for('view_note', note_id=0)[:-1]|tojson }}
};
</script>
<script src="{{ url_for('static', filename='kanban_app.js') }}"></script>
{% endblock %}
